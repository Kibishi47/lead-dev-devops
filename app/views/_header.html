<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Express App Testing Demo</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <!-- Firebase App & Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  </head>
  <body>
    <header class="page-header">
      <div class="container">
        <div class="row">
          <div class="col-sm-8">
            <h1>Express App Testing Demo</h1>
            <p class="lead">
              <a href="coverage/lcov-report/index.html">Istanbul Code Coverage Report</a>
            </p>
            <p>
              This demo uses
              <a href="https://www.flickr.com/services/feeds/docs/photos_public/" target="_blank">
                Flickr's Public Feed API
              </a>
              to search public photos.
            </p>
          </div>
          <!-- Firebase Auth Block -->
          <div class="col-sm-4 text-right" style="padding-top: 15px;">
            <div id="auth-logged-out">
              <button id="btn-login" class="btn btn-default" onclick="loginWithGoogle()" style="display: inline-flex; align-items: center; gap: 8px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" width="18" height="18">
                Se connecter avec Google
              </button>
            </div>
            <div id="auth-logged-in" style="display: none;">
              <div style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-bottom: 8px;">
                <img id="user-avatar" src="" alt="Avatar" width="36" height="36" style="border-radius: 50%;">
                <div style="text-align: left;">
                  <strong id="user-name"></strong><br>
                  <small id="user-email" class="text-muted"></small>
                </div>
              </div>
              <button class="btn btn-xs btn-danger" onclick="logoutFirebase()">Se déconnecter</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <script>
      const firebaseConfig = {
        apiKey: "<%= typeof firebaseApiKey !== 'undefined' ? firebaseApiKey : 'AIzaSyDummyKey' %>",
        authDomain: "ecni2-2026.firebaseapp.com",
        projectId: "ecni2-2026",
        databaseURL: "https://ecni2-2026-default-rtdb.firebaseio.com"
      };
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }

      firebase.auth().onAuthStateChanged(function(user) {
        const loggedOutEl = document.getElementById('auth-logged-out');
        const loggedInEl = document.getElementById('auth-logged-in');
        if (user) {
          if (loggedOutEl) loggedOutEl.style.display = 'none';
          if (loggedInEl) loggedInEl.style.display = 'block';
          document.getElementById('user-name').textContent = user.displayName || user.email;
          document.getElementById('user-email').textContent = user.email;
          if (user.photoURL) {
            document.getElementById('user-avatar').src = user.photoURL;
            document.getElementById('user-avatar').style.display = 'inline-block';
          } else {
            document.getElementById('user-avatar').style.display = 'none';
          }
        } else {
          if (loggedOutEl) loggedOutEl.style.display = 'block';
          if (loggedInEl) loggedInEl.style.display = 'none';
        }
      });

      function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider).catch(function(error) {
          console.error("Erreur d'authentification Google Sign-In:", error);
          alert("Erreur lors de la connexion Google: " + error.message);
        });
      }

      function logoutFirebase() {
        firebase.auth().signOut();
      }
    </script>
