<hr>

<div class="panel panel-default search-results">
  <div class="panel-heading">
    <h3 class="panel-title">Search Results</h3>
  </div>
  <div class="panel-body">

    <% if (photos.length) { %>

      <% if (typeof zipDownloadUrl !== 'undefined' && zipDownloadUrl) { %>
        <div class="alert alert-success" style="margin-bottom: 15px;">
          <strong>Votre archive ZIP est prête !</strong><br>
          <a href="<%= zipDownloadUrl %>" class="btn btn-success" target="_blank" style="margin-top: 10px;">
            Télécharger le fichier ZIP
          </a>
        </div>
      <% } else { %>
        <form action="/zip?tags=<%= encodeURIComponent(tagsParameter) %>" method="POST" style="margin-bottom: 15px;">
          <button type="submit" class="btn btn-primary">Zipper les 10 premières photos</button>
        </form>
      <% } %>

      <ul>
        <% photos.forEach(function (photo) { %>
          <li class="list-unstyled">
            <a href="<%= photo.media.b %>" class="thumbnail">
              <img src="<%= photo.media.t %>" alt="Photo - <%= photo.title %>"
                title="<%= photo.title %>">
            </a>
          </li>
        <% }) %>
      </ul>

    <% } else { %>
      <div class="alert alert-info"><strong>No results</strong></div>
    <% } %>

  </div>

</div>
